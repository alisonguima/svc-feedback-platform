name: Testar e implantar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - name: Testes + gate de cobertura (JaCoCo 100% linha) + jar
        run: mvn -B verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint do template (cfn-lint)
        run: pip install cfn-lint && cfn-lint template.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-jar
          path: target/feedback.jar

  implantar:
    needs: testar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: feedback-jar
          path: target
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      # Usuario IAM dedicado ao deploy (infra/github-deploy-user.yaml). OIDC seria o
      # ideal, mas o plano Free da AWS bloqueia provedores de identidade (iam:*Provider*).
      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides AdminEmail="${{ secrets.ADMIN_EMAIL }}"

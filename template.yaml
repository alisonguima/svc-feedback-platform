AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Tech Challenge Fase 4 - Plataforma serverless de feedback de aulas.
  API (POST /avaliacao) -> Lambda -> DynamoDB; notificacao de urgencia via stream;
  relatorio semanal agendado; monitoramento com CloudWatch.

Parameters:
  AdminEmail:
    Type: String
    Description: E-mail do administrador (recebe urgencias, relatorios e alarmes). Exige confirmar a inscricao do SNS.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Informe um email valido.
  RetencaoLogsDias:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: Retencao dos logs no CloudWatch (evita acumulo e custo).

Globals:
  Function:
    Runtime: java21
    Architectures: [arm64]
    # Um unico jar (mvn package) com os 3 handlers; cada funcao aponta para o seu.
    CodeUri: target/feedback.jar
    Timeout: 20
    MemorySize: 512
    Environment:
      Variables:
        # Reduz o cold start da JVM em funcoes curtas.
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    Tags:
      projeto: techchallenge-fase4

Resources:
  # ------------------------------------------------------------------ Dados
  AvaliacoesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST # sem capacidade provisionada: custo zero sem uso
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: dia, AttributeType: S }
        - { AttributeName: dataEnvio, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: dia-index # relatorio semanal: 1 Query por dia, sem Scan
          KeySchema:
            - { AttributeName: dia, KeyType: HASH }
            - { AttributeName: dataEnvio, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE # aciona a funcao de notificacao
      # Criptografia em repouso: ativa por padrao no DynamoDB (chave gerenciada pela AWS, sem custo).

  # ------------------------------------------------------------------ Mensageria
  AdminTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Feedback Plataforma - Admin

  AdminEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AdminTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  # ------------------------------------------------------------------ Logs (retencao definida)
  ReceberLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-receber-avaliacao"
      RetentionInDays: !Ref RetencaoLogsDias
  NotificarLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-notificar-urgencia"
      RetentionInDays: !Ref RetencaoLogsDias
  RelatorioLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-gerar-relatorio"
      RetentionInDays: !Ref RetencaoLogsDias

  # ------------------------------------------------------------------ API
  AvaliacaoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod
      Auth:
        ApiKeyRequired: true # a chave de API protege todos os metodos
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: !Sub "${AWS::StackName}-plano"
          Throttle:
            RateLimit: 5
            BurstLimit: 10
          Quota:
            Limit: 5000
            Period: MONTH
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: "*"
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
          MetricsEnabled: true
      Tags:
        projeto: techchallenge-fase4

  # ------------------------------------------------------------------ Funcoes
  ReceberAvaliacaoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-receber-avaliacao"
      Description: Valida, classifica a urgencia e grava a avaliacao.
      Handler: com.techchallenge.feedback.adapter.input.lambda.handler.ReceiveFeedbackHandler::handleRequest
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ReceberLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref AvaliacoesTable
      Policies: # menor privilegio: so grava nesta tabela
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AvaliacoesTable.Arn
      Events:
        PostAvaliacao:
          Type: Api
          Properties:
            RestApiId: !Ref AvaliacaoApi
            Path: /avaliacao
            Method: post
            Auth:
              ApiKeyRequired: true

  NotificarUrgenciaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-notificar-urgencia"
      Description: Envia e-mail ao admin quando uma avaliacao critica e gravada.
      Handler: com.techchallenge.feedback.adapter.input.lambda.handler.NotifyUrgencyHandler::handleRequest
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref NotificarLogGroup
      Environment:
        Variables:
          ADMIN_TOPIC_ARN: !Ref AdminTopic
      Policies: # a leitura do stream e concedida automaticamente pelo SAM ao event source
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AdminTopic
      Events:
        AvaliacaoCritica:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AvaliacoesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"], "dynamodb": {"NewImage": {"urgencia": {"S": ["CRITICAL"]}}}}'

  GerarRelatorioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-gerar-relatorio"
      Description: Consolida as avaliacoes dos ultimos 7 dias e envia o relatorio por e-mail.
      Handler: com.techchallenge.feedback.adapter.input.lambda.handler.WeeklyReportHandler::handleRequest
      Timeout: 60
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RelatorioLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref AvaliacoesTable
          ADMIN_TOPIC_ARN: !Ref AdminTopic
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${AvaliacoesTable.Arn}/index/dia-index"
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AdminTopic
      Events:
        RelatorioSemanal:
          Type: ScheduleV2 # EventBridge Scheduler
          Properties:
            ScheduleExpression: cron(0 8 ? * MON *) # toda segunda-feira, 08:00
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"dias": 7}'
            Description: Dispara o relatorio semanal de avaliacoes.

  # ------------------------------------------------------------------ Alarmes (problemas do sistema -> e-mail do admin)
  ReceberErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-receber-avaliacao-erros"
      AlarmDescription: A funcao receber-avaliacao apresentou erros.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ReceberAvaliacaoFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AdminTopic]

  NotificarErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-notificar-urgencia-erros"
      AlarmDescription: A funcao notificar-urgencia apresentou erros (urgencias podem nao ter sido avisadas).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref NotificarUrgenciaFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AdminTopic]

  RelatorioErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-gerar-relatorio-erros"
      AlarmDescription: A funcao gerar-relatorio apresentou erros.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref GerarRelatorioFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AdminTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: A API retornou erros 5xx.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - { Name: ApiName, Value: !Sub "${AWS::StackName}-api" }
        - { Name: Stage, Value: prod }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AdminTopic]

  # ------------------------------------------------------------------ Dashboard
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-monitoramento"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Invocacoes por funcao", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ReceberAvaliacaoFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${NotificarUrgenciaFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GerarRelatorioFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Erros por funcao", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${ReceberAvaliacaoFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${NotificarUrgenciaFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${GerarRelatorioFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Duracao media (ms)", "region": "${AWS::Region}", "stat": "Average", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ReceberAvaliacaoFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${NotificarUrgenciaFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${GerarRelatorioFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway: requisicoes, 4xx e 5xx", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"]
                ]
              }
            },
            {
              "type": "alarm", "x": 0, "y": 12, "width": 24, "height": 4,
              "properties": {
                "title": "Estado dos alarmes",
                "alarms": [
                  "${ReceberErrosAlarm.Arn}",
                  "${NotificarErrosAlarm.Arn}",
                  "${RelatorioErrosAlarm.Arn}",
                  "${Api5xxAlarm.Arn}"
                ]
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: URL do endpoint POST /avaliacao (exige o header x-api-key).
    Value: !Sub "https://${AvaliacaoApi}.execute-api.${AWS::Region}.amazonaws.com/prod/avaliacao"
  TabelaAvaliacoes:
    Description: Nome da tabela DynamoDB.
    Value: !Ref AvaliacoesTable
  FuncaoRelatorio:
    Description: Nome da funcao do relatorio (para invocar manualmente na demonstracao).
    Value: !Ref GerarRelatorioFunction
  Dashboard:
    Description: Nome do dashboard do CloudWatch.
    Value: !Ref Dashboard
